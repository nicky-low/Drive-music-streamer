name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Default is "tools platform-tools". Google removed the legacy
          # "tools" package from its SDK repo on 2026-09-14, which makes
          # sdkmanager exit 1 and fails this step before the build runs.
          # We don't need it — Gradle fetches platforms/build-tools itself.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drivestreamer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
