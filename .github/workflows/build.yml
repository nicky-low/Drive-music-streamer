name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed so the last step can publish the APK as a release.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Default is "tools platform-tools". Google removed the legacy
          # "tools" package from its SDK repo on 2026-09-14, which makes
          # sdkmanager exit 1 and fails this step before the build runs.
          # We don't need it - Gradle fetches platforms/build-tools itself.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drivestreamer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A release has a plain download link that works from a phone browser
      # or the GitHub app, with no sign-in needed (unlike workflow artifacts).
      # The same release is replaced on every build, so its link never changes.
      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk inshyra-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug inshyra-debug.apk \
            --title "Latest debug build" \
            --notes "Debug APK built from commit ${{ github.sha }}." \
            --prerelease \
            --target ${{ github.sha }}