# Required — every dependency in this project is AndroidX (androidx.*,
# Material, Media3), and the build fails without this flag.
android.useAndroidX=true

# Rewrites any old com.android.support.* references in transitive deps
# to their AndroidX equivalents. Harmless if nothing needs it.
android.enableJetifier=false

# Give the Gradle daemon enough heap — the default (512m) is tight for
# Kotlin + AGP and can cause slow or OOM-flaky builds on CI runners.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build only the resources for the variant being built, not all of them.
android.nonTransitiveRClass=true

org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
